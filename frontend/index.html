<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Kinetic Oracle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F5FF00',
                        surface: '#131313',
                        surfaceContent: '#201f1f',
                        secondary: '#7edb7f',
                    },
                    fontFamily: {
                        headline: ['Space Grotesk', 'sans-serif'],
                        body: ['Manrope', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        .kinetic-glow {
            background: radial-gradient(circle at top right, rgba(245, 255, 0, 0.1) 0%, transparent 40%),
                        radial-gradient(circle at bottom left, rgba(126, 219, 127, 0.05) 0%, transparent 40%);
        }
    </style>
</head>
<body class="bg-surface text-white font-body min-h-screen flex flex-col justify-center items-center p-6 kinetic-glow">
    
    <div class="w-full max-w-md">
        <div class="text-center mb-10">
            <h1 class="font-headline font-black italic text-4xl text-primary tracking-tighter uppercase mb-2">KINETIC ORACLE</h1>
            <p class="text-white/40 text-sm uppercase tracking-widest font-bold">A.I. POWERED FITNESS ANALYSIS</p>
        </div>

        <div class="bg-surfaceContent/60 backdrop-blur-xl p-8 rounded-[2.5rem] border border-white/5 shadow-2xl">
            <h2 class="font-headline text-2xl font-bold mb-6">Welcome Back</h2>
            
            <form onsubmit="event.preventDefault(); window.location.href='dashboard.html';" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-white/40 mb-2 px-1">Email Address</label>
                    <input type="email" placeholder="alex.rivera@kinetic.com" class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:border-primary outline-none transition-all text-sm">
                </div>
                
                <div class="mb-6">
                    <label class="block text-[10px] font-bold uppercase tracking-widest text-white/40 mb-2 px-1">Password</label>
                    <input type="password" placeholder="••••••••" class="w-full bg-white/5 border border-white/10 rounded-2xl px-5 py-4 focus:border-primary outline-none transition-all text-sm">
                </div>

                <button type="submit" class="w-full bg-primary text-black font-headline font-black py-5 rounded-2xl uppercase tracking-widest hover:scale-[1.02] active:scale-[0.98] transition-all shadow-[0_0_20px_rgba(245,255,0,0.3)]">
                    Login
                </button>
            </form>

            <div class="mt-8 pt-8 border-t border-white/5 text-center">
                <p class="text-white/40 text-xs">Don't have an Account? <a href="dashboard.html" class="text-secondary font-bold">Initialize Account</a></p>
            </div>
        </div>

        <!-- Demo Credentials -->
        <div class="mt-8 p-6 rounded-3xl bg-white/5 border border-white/5 text-center">
            <p class="text-[10px] font-bold uppercase tracking-widest text-primary mb-3">Demo Credentials</p>
            <div class="flex justify-center gap-6 text-xs text-white/60">
                <p><span class="text-white/30">Email:</span> alex.rivera@kinetic.com</p>
                <p><span class="text-white/30">Pass:</span> oracle2026</p>
            </div>
        </div>
    </div>

</body>
</html>
