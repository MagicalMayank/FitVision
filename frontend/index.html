<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FitVision - Loading</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#131313">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: var(--surface, #131313);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            animation: splashEntrance 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .splash-logo-wrapper {
            position: relative;
            width: 140px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .splash-logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(245, 255, 0, 0.45));
            animation: logoPulse 1.8s ease-in-out infinite alternate;
        }

        .splash-title {
            font-family: var(--font-headline, 'Space Grotesk', sans-serif);
            font-weight: 900;
            font-style: italic;
            font-size: 2.2rem;
            color: var(--primary-fixed, #F5FF00);
            letter-spacing: -0.04em;
            margin-top: 1.5rem;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(245, 255, 0, 0.3);
        }

        .splash-tagline {
            font-family: var(--font-label, 'Manrope', sans-serif);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            color: var(--on-surface-variant, #8a99ad);
            text-transform: uppercase;
            margin-top: 0.35rem;
            opacity: 0.8;
        }

        @keyframes splashEntrance {
            0% {
                opacity: 0;
                transform: scale(0.75);
            }
            60% {
                opacity: 1;
                transform: scale(1.03);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes logoPulse {
            0% {
                filter: drop-shadow(0 0 15px rgba(245, 255, 0, 0.3));
            }
            100% {
                filter: drop-shadow(0 0 35px rgba(245, 255, 0, 0.65));
            }
        }
    </style>
</head>
<body class="kinetic-glow">

    <div class="splash-container">
        <div class="splash-logo-wrapper">
            <img src="FV icon.png" alt="FitVision Icon" class="splash-logo-img">
        </div>
        <h1 class="splash-title">FITVISION</h1>
        <p class="splash-tagline">AI Biomechanical Intelligence</p>
    </div>

    <script src="js/app.js"></script>
    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const profile = localStorage.getItem('fitvision_user_profile');
                const targetUrl = profile ? 'dashboard.html' : 'onboarding.html';

                const performNavigation = () => {
                    window.location.href = targetUrl;
                };

                if (document.startViewTransition) {
                    document.startViewTransition(() => performNavigation());
                } else {
                    performNavigation();
                }
            }, 1850);
        });
    </script>
</body>
</html>
